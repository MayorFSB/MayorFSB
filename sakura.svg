<svg xmlns="http://w3.org" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Небесный розово-голубой градиент (закат/рассвет) -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1c4fd" />  <!-- Нежно-голубой -->
      <stop offset="100%" stop-color="#c2e9fb" /> <!-- Переход в розово-сиреневый -->
    </linearGradient>

    <!-- Стили для анимации (будем дополнять) -->
    <style>
      .sky {
        fill: url(#skyGradient);
      }
    </style>
  </defs>

  <!-- СЛОЙ 1: НЕБО -->
  <rect class="sky" width="800" height="400" />

  <!-- Здесь будут следующие слои -->

</svg>
