<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="falling sakura petals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#FFF5F7"/>
    </linearGradient>
    <g id="petal">
      <path d="M0 0 C6 -12 20 -12 24 0 C20 12 6 12 0 0 Z" fill="#F48FB1" opacity="0.92"/>
      <path d="M0 0 C6 -12 20 -12 24 0" fill="none" stroke="#F06292" stroke-width="0.8" opacity="0.5"/>
    </g>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>
  <use href="#petal">
    <animateTransform attributeName="transform" type="translate" values="60 0; 60 230" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0; 360" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; 40 0; -20 0; 0 0" dur="3.2s" repeatCount="indefinite"/>
  </use>
  <use href="#petal" transform="translate(150 40) scale(0.7)">
    <animateTransform attributeName="transform" type="translate" values="150 0; 150 230" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="360; 0" dur="6s" repeatCount="indefinite"/>
  </use>
  <use href="#petal" transform="translate(260 10) scale(0.9)">
    <animateTransform attributeName="transform" type="translate" values="260 0; 260 230" dur="6.5s" begin="0.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0; -360" dur="4.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; -50 0; 30 0; 0 0" dur="2.6s" repeatCount="indefinite"/>
  </use>
  <use href="#petal" transform="translate(380 60) scale(0.6)">
    <animateTransform attributeName="transform" type="translate" values="380 0; 380 230" dur="8.2s" begin="2.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0; 360" dur="5.5s" repeatCount="indefinite"/>
  </use>
  <use href="#petal" transform="translate(490 20) scale(0.8)">
    <animateTransform attributeName="transform" type="translate" values="490 0; 490 230" dur="7.4s" begin="1.1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="360; 0" dur="4.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; 35 0; -35 0; 0 0" dur="2.9s" repeatCount="indefinite"/>
  </use>
  <use href="#petal" transform="translate(600 45) scale(0.7)">
    <animateTransform attributeName="transform" type="translate" values="600 0; 600 230" dur="9.5s" begin="0.3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0; 360" dur="6.2s" repeatCount="indefinite"/>
  </use>
  <use href="#petal" transform="translate(700 5) scale(0.9)">
    <animateTransform attributeName="transform" type="translate" values="700 0; 700 230" dur="6.8s" begin="1.9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="360; 0" dur="5.1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0; -45 0; 45 0; 0 0" dur="3.4s" repeatCount="indefinite"/>
  </use>
  <text x="400" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#AD1457" font-style="italic">Calm code in a nervous world</text>
</svg>
